<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>birthday</title>
    <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
<link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="container">
  <div class="verse-bg" id="verse-bg">
    <p class="verse" id="verse">Loading Bible...</p>
  </div>
  <p class="verse-info" id="verse-info"></p>

  <div class="controls">
    <div class="row">
      <select id="booklist"></select>
      <select id="chapterlist"></select>
      <select id="verselist"></select>
      <button id="go-to-verse" class="controls-item"><i class="fa fa-share"></i> Go...</button>
      <button id="add-to-queue" class="controls-item"><i class="fa fa-plus"></i> Queue</button>
    </div>
    <div class="row">
      <button id="previous-verse" class="controls-item"><i class="fa fa-arrow-left"></i> Prev</button>
      <button id="next-verse" class="controls-item">Next <i class="fa fa-arrow-right"></i></button>
    </div>
  </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
